server {
    listen 80;
    root /usr/share/nginx/html;

    # API calls go to the FastAPI container
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;  # long AI answers can take a while
    }

    # Any other path loads the React app (so /about works after a refresh)
    location / {
        try_files $uri /index.html;
    }
}
